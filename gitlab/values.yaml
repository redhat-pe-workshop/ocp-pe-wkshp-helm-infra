gitlab:
  image: quay.io/redhat-gpte/gitlab:17.4.1
  email:
    address: "gitlab@rhdemo.com"
    displayName: "GitLab Admin"
    replyTo: "noreply@rhdemo.com"
  smtp:
    enabled: "false"
    domain: "rhdemo.com"
    host:
    port: "587"
    user: "gitlab"
    password: "gitlab"
  ssh:
    host:
    port: "22"
  rootPassword:
  host:
  https: "true"
  rootEmail: "root@rhdemo.com"
  keyBase:
    db: "0123456789"
    otp: "0123456789"
    secret: "0123456789"
  users:
    users:
      - id: dev1
        name: Dave Developer
      - id: dev2
        name: Divya Developer
      - id: pe1
        name: Paul PlatEngineer
      - id: pe2
        name: Priya PlatEngineer
    password: 
  groups:
    - name: rhdh
      repo:
        - name: developer-hub-config
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-developer-hub-config.git
        - name: devfiles
          url: https://github.com/redhat-ads-tech/devfiles.git
        - name: rhdh-templates
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-rhdh-templates.git
        - name: helm-charts
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-apps-helm.git
        - name: infra-app-of-apps
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-infra-app-of-apps.git
        - name: ocp-pe-wkshp-rhdh-configs
          url: https://github.com/redhat-pe-workshop/ocp-pe-wkshp-rhdh-configs.git
        - name: prerequisite-samples
          url: https://github.com/redhat-pe-workshop/prerequisite-samples.git
      users:
        - id: pe1
        - id: pe2
      project:
        - name: rhdh-issues
          labels:
            - name: approved
              color: green
            - name: denied
              color: red        
    - name: devteam1
      repo: []
      users:
        - id: dev1
        - id: dev2
    - name: parasol
      repo:
        - name: parasol-insurance
          url: https://github.com/redhat-pe-workshop/parasol-insurance.git
        - name: parasol-insurance-manifests
          url: https://github.com/redhat-pe-workshop/parasol-insurance-manifests.git
        - name: parasol-insurance-secured-manifests
          url: https://github.com/redhat-pe-workshop/parasol-insurance-secured-manifests.git
        - name: parasol-entities
          url: https://github.com/redhat-pe-workshop/parasol-entities.git
      users:
        - id: dev1
        - id: dev2
        - id: pe1
        - id: pe2
  templates:
    - group: parasol
      project: parasol-insurance
      branch: main
      templates:
        - devfile.yaml
    - group: rhdh
      project: rhdh-templates
      branch: main
      templates:
        - templates/parasol-insurance-secured/template.yaml
        - templates/request-kafka-topic/template.yaml
        - templates/request-kafka-user/template.yaml
        - templates/quarkus-rest-api/template.yaml
    - group: rhdh
      project: ocp-pe-wkshp-rhdh-configs
      branch: main
      templates:
        - base/configmap-app-config.yaml
        - overlays/02-sso-plugins/configmap-app-config-auth.yaml
        - overlays/03-catalog-entities/configmap-app-config-catalog.yaml
        - overlays/04-templates/configmap-app-config-catalog.yaml
        - overlays/05-lightspeed/configmap-app-config-lightspeed.yaml
postgresql:
  dbUser: gitlab
  dbPassword: passw0rd
  dbName: gitlab_production

cluster:
  subdomain:
  apiServer:

gitops:
  namespace:
  project: default

quay:
  host: 

vault:
  name: vault
  namespace: vault

orchestrator:
